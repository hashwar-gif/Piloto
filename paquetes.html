<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paquetes - HASHWAR</title>
  
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./public/css/styles.css">
    <link rel="stylesheet" href="./public/css/styles_header.css">
    
    <style>
        :root {
            --primary-glow: #00d4ff;
            --secondary-glow: #0055ff;
            --dark-bg: #000814;
        }

        /* Redes Sociales Sidebar */
        .social-sidebar {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--primary-glow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-glow);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background: var(--primary-glow);
            color: #000;
            transform: scale(1.2) translateX(5px);
        }
    </style>
</head>
<body>
    <!-- Redes Sociales Sidebar -->
    <div class="social-sidebar d-none d-lg-flex">
        <a href="#" class="social-icon"><i class="fab fa-tiktok"></i></a>
        <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
        <a href="#" class="social-icon"><i class="fab fa-telegram"></i></a>
        <a href="#" class="social-icon"><i class="fab fa-youtube"></i></a>
    </div>

    <!-- Header Dinámico -->
    <div id="header-placeholder"></div>
    <script src="./public/js/header.js"></script>

    <section class="packages py-5" id="packages" style="padding-top: 90px !important;">
        <div class="container">
            <h2 class="section-title text-center mb-5" style="color: #00d4ff; font-family: 'Orbitron', sans-serif;">NUESTROS PAQUETES</h2>
            <div id="package-loading" class="text-center py-5"><i class="fas fa-spinner fa-spin fa-3x text-info"></i><p class="mt-2 text-info">Cargando paquetes...</p></div>
            <div id="package-list" class="row g-4"></div>
        </div>
    </section>

    <!-- Footer Dinámico -->
    <div id="footer-placeholder"></div>
    <script src="./public/js/footer.js"></script>
    <link rel="stylesheet" href="./public/css/styles_footer.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    async function waitForAPI() {
        while (typeof HashwarAPI === 'undefined') await new Promise(r => setTimeout(r, 100));
    }
    async function loadPackages() {
        await waitForAPI();
        const loading = document.getElementById('package-loading');
        const list = document.getElementById('package-list');
        try {
            const data = await HashwarAPI.getPackages();
            loading.style.display = 'none';
            const colors = ['#00d4ff', '#ff0055', '#00d4ff'];
            list.innerHTML = data.packages.map((p, i) => `
                <div class="col-md-4">
                    <div class="package-card p-4 h-100 text-center" style="background: rgba(0, 31, 58, 0.5); border: 1px solid ${colors[i % colors.length]}; border-radius: 15px;">
                        <h3 class="package-name" style="color: #fff; text-transform: uppercase;">${p.name}<br><span style="font-size: 0.8em; opacity: 0.8;">(TIER ${p.tier})</span></h3>
                        <div class="package-price my-3 fs-2 fw-bold" style="color: ${colors[i % colors.length]};">$${parseFloat(p.price).toFixed(2)}</div>
                        <ul class="list-unstyled mb-4 text-start" style="color: #fff;">
                            ${p.features.map(f => `<li><i class="fas fa-check text-success me-2"></i> ${f}</li>`).join('')}
                        </ul>
                        <button class="btn btn-outline-info w-100" onclick="subscribe('${p.id}')">SUSCRIBIRSE</button>
                    </div>
                </div>
            `).join('');
        } catch(e) {
            loading.innerHTML = `<p class="text-danger">Error al cargar paquetes: ${e.message}</p>`;
        }
    }
    async function subscribe(id) {
        if (!HashwarAPI.isLoggedIn()) { alert('Inicia sesión para suscribirte'); return; }
        try {
            const r = await HashwarAPI.subscribe(id);
            if (r.success) alert('¡Suscripción activada!');
        } catch(e) { alert(e.message); }
    }
    document.addEventListener('DOMContentLoaded', loadPackages);
    </script>
    </body>
    </html>
